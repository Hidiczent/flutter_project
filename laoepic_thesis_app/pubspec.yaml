name: laoepic_thesis_app
description: "Lao Epic — tourism booking mobile app."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.7 
  intl: ^0.20.2
  shared_preferences: ^2.2.2 
  http: ^1.3.0
  image_picker: ^1.0.2
  provider: ^6.1.5
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  pdf: ^3.11.3
  printing: ^5.14.2
  google_sign_in: ^6.2.2
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

 
  flutter_lints: ^5.0.0
  




flutter:

  
  uses-material-design: true
  assets:
  - assets/images/
  - assets/i18n/
  - assets/Logo/
  - assets/body_content/
  - .env
 


  
